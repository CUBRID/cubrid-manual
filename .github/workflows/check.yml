name: CUBRID Manual CI/CD (Rocky Linux)

on:
  push:
    branches: [ "develop", "release/[0-9]*" ]
  pull_request_target:
    branches: [ "develop", "release/[0-9]*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# [JOB 1] Parallel Build (en / ko)
# ---------------------------------------------------------------------------
jobs:
  build_docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      merged_pr: ${{ steps.pr_info.outputs.merged_pr }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
    strategy:
      matrix:
        lang: [en, ko]
      fail-fast: false
    container:
      image: rockylinux:9.3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Compute short SHA
        id: sha
        run: |
          FULL_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "short_sha=${FULL_SHA::7}" >> $GITHUB_OUTPUT

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies (with Retry)
        run: |
          # DNF Retry Logic
          for i in {1..3}; do
            dnf install -y epel-release && \
            dnf install -y glibc-locale-source glibc-langpack-ko \
              gcc make openssl-devel bzip2-devel libffi-devel zlib-devel unzip pango cairo \
              git gdk-pixbuf2 python3.12 python3.12-pip jq && break || sleep 5;
          done
          update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.12 2
          update-alternatives --set python3 /usr/bin/python3.12
          # PIP Retry Logic
          for i in {1..3}; do
            pip3.12 install 'urllib3<2.0' Sphinx==9.1.0 \
              sphinx_design sphinxext-rediraffe sphinxawesome-theme==6.0.0 \
              weasyprint==68.0 sphinx-simplepdf==1.7 sphinx-rtd-theme && break || sleep 5;
          done
          localedef -f UTF-8 -i ko_KR ko_KR.utf8

      - name: Build Manual (HTML & PDF)
        env:
          LANG: ko_KR.utf8
        run: |
          cd ${{ matrix.lang }}
          make html
          make pdf
          if [ -f "_build/simplepdf/CUBRID.pdf" ]; then
            cp _build/simplepdf/CUBRID.pdf _build/html/CUBRID.pdf
          fi

      # Save PR number for later jobs (push event only)
      - name: Get PR number
        if: github.event_name == 'push'
        id: pr_info
        run: |
          PR_NUMBER=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            | jq -r '.[0].number')
          echo "merged_pr=${PR_NUMBER:-manual-push}" >> $GITHUB_OUTPUT

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ matrix.lang }}
          path: ./${{ matrix.lang }}/_build/html
          retention-days: 1

  # ---------------------------------------------------------------------------
  # [JOB 2] Sequential Deployment (en → ko, one at a time)
  # ---------------------------------------------------------------------------
  deploy_docs:
    needs: build_docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-deploy-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    strategy:
      matrix:
        lang: [en, ko]
      max-parallel: 1
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ matrix.lang }}
          path: ./dist

      # --- PR Preview Deploy ---
      - name: Deploy Preview
        if: github.event_name == 'pull_request_target'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: pr-preview/${{ github.event.pull_request.number }}/${{ matrix.lang }}
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      # --- Official Deploy (per-commit) ---
      - name: Set short SHA
        if: github.event_name == 'push'
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Deploy Official (per-commit)
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: ${{ matrix.lang }}/${{ github.ref_name }}/${{ env.SHORT_SHA }}
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      # --- Official Deploy (latest) ---
      - name: Deploy Official (latest)
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: ${{ matrix.lang }}/${{ github.ref_name }}/latest
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

  # ---------------------------------------------------------------------------
  # [JOB 3] Post Comments (after all deploys finish)
  # ---------------------------------------------------------------------------
  comment_on_pr:
    needs: [build_docs, deploy_docs]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # --- Case A: PR Preview Link ---
      - name: Comment PR Preview Link
        if: github.event_name == 'pull_request_target'
        uses: thollander/actions-comment-pull-request@v2
        with:
          github_token: ${{ secrets.GH_PAGES_TOKEN }}
          pr_number: ${{ github.event.pull_request.number }}
          message: |
            ✅ **CUBRID Manual Preview is Ready!**

            All docs (KO/EN) are successfully built and deployed.

            | Type | 🇰🇷 Korean (KO) | 🇺🇸 English (EN) |
            | :--- | :--- | :--- |
            | 🌐 **Web** | [View Docs](https://${{ github.repository_owner }}.github.io/cubrid-manual/pr-preview/${{ github.event.pull_request.number }}/ko/index.html) | [View Docs](https://${{ github.repository_owner }}.github.io/cubrid-manual/pr-preview/${{ github.event.pull_request.number }}/en/index.html) |
            | 📄 **PDF** | [Download](https://${{ github.repository_owner }}.github.io/cubrid-manual/pr-preview/${{ github.event.pull_request.number }}/ko/CUBRID.pdf) | [Download](https://${{ github.repository_owner }}.github.io/cubrid-manual/pr-preview/${{ github.event.pull_request.number }}/en/CUBRID.pdf) |
          comment_tag: cubrid-manual-preview
          mode: recreate

      # --- Case B: Official Deployment Success (Merge only) ---
      - name: Comment Official Deploy Success
        if: github.event_name == 'push' && needs.build_docs.outputs.merged_pr != 'null' && needs.build_docs.outputs.merged_pr != 'manual-push'
        uses: thollander/actions-comment-pull-request@v2
        with:
          github_token: ${{ secrets.GH_PAGES_TOKEN }}
          pr_number: ${{ needs.build_docs.outputs.merged_pr }}
          message: |
            🚀 **Official Deployment Complete!**

            The changes have been merged and published to the official manual.

            | Language | 🌐 Official Web Link (latest) | 📌 This Commit (`${{ needs.build_docs.outputs.short_sha }}`) |
            | :--- | :--- | :--- |
            | 🇰🇷 **Korean** | [View Official](https://${{ github.repository_owner }}.github.io/cubrid-manual/ko/${{ github.ref_name }}/latest/index.html) | [View Commit](https://${{ github.repository_owner }}.github.io/cubrid-manual/ko/${{ github.ref_name }}/${{ needs.build_docs.outputs.short_sha }}/index.html) |
            | 🇺🇸 **English** | [View Official](https://${{ github.repository_owner }}.github.io/cubrid-manual/en/${{ github.ref_name }}/latest/index.html) | [View Commit](https://${{ github.repository_owner }}.github.io/cubrid-manual/en/${{ github.ref_name }}/${{ needs.build_docs.outputs.short_sha }}/index.html) |
          comment_tag: cubrid-manual-official-deploy
          mode: create
